# Open Duck Mini v2 part, built with the build-part-from-image skill.
id: waveshare-bus-servo-adapter
name: Waveshare Bus Servo Adapter (A)
description: Drives Feetech/Waveshare serial bus servos (STS/SCS) from a USB-C port or a 3.3/5 V UART.
  Jumpers pick A (UART) or B (USB). Two servo ports, servo power from the DC jack or DC+/DC- terminal.
manufacturer: Waveshare
family: Motor
tags:
- servo
- bus
- driver
- usb
- uart
- sts3215
package: THT
pinSpacing: 2.54
voltage: Servo supply per servo spec; UART 3.3/5V
partNumber: Bus Servo Adapter (A)
properties:
  host: USB-C (CH343) or TX/RX UART header
  servo ports: 2× 5264-3P (D V G)
  jumpers: A = UART ↔ servo, B = USB ↔ servo
version: 0.1.0
pcbColor: '#111111'
aspect: 1.233
dimensions:
  width: 42
  height: 34
shape:
  kind: rect
  cornerRadiusMm: 2
# Every port drawn as its real housing: the two 5264-3P servo ports (2.5 mm
# pitch, as JST XH), the 0.1" UART header and the DC screw terminal. The order
# below is the old header order, so every wire's #index is unchanged.
# The servo and UART labels sit above the board: the photo's own silk (D V G,
# TX RX GND) is right under those housings.
