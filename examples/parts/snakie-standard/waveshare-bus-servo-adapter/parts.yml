# Open Duck Mini v2 part, built with the build-part-from-image skill.
id: waveshare-bus-servo-adapter
name: Waveshare Bus Servo Adapter (A)
description: Drives Feetech/Waveshare serial bus servos (STS/SCS) from a USB-C port or a 3.3/5 V UART.
  Jumpers pick A (UART) or B (USB). Two servo ports, servo power from the DC jack or DC+/DC- terminal.
