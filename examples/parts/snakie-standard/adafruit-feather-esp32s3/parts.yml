  maxCurrentA: 0.6
  outputV: 3.3
  dropoutV: 0.25
  # `3V` is the pair of breakout pads on the left edge — the ones the help page
  # points at for powering sensors. The QWIIC pad is labelled `3V3` and the
  # netlist bonds by label, so it is a separate rail until the labels are unified.
  inputRail: USB
  outputRail: 3V
  terminals:
    positive: USB
    negative: GND
