    z: 3
# The onboard OLED (0x3C) and RTC (0x51) both hang off the same I²C bus as the
# Grove I²C ports, so an i2c.scan() on a populated board shows them too (#214).
i2cAddresses: [60, 81]
help: help.md
layerVisibility:
