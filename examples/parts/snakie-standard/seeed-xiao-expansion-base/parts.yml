    stroke: "#b8b4a8"
    strokeWidth: 1
    cornerRadius: 1
    z: 1
labels:
  - text: XIAO
    x: 0.70
    y: 0.11
    fontSize: 7
    color: "#cfe8dc"
    z: 3
  - text: SD
    x: 0.885
