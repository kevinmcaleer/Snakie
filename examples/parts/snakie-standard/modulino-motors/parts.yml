id: modulino-motors
name: Modulino Motors
description: Dual H-bridge motor driver on an I²C Modulino — two DC motors, or one stepper.
manufacturer: Arduino
family: Motor
tags:
  - modulino
  - arduino
  - i2c
  - qwiic
  - motor
  - h-bridge
  - stepper
  - max22211
package: SMD
voltage: 3.3V
partNumber: ABX00114
properties:
  interface: I²C (0x48, re-addressable — onboard MCU)
  driver: MAX22211 dual H-bridge
  outputs: 2 brushed DC motors, 1 bipolar stepper, or solenoids/valves
  current: up to 3.8 A per channel
  supply: separate 5–24 V motor supply; logic stays 3.3 V
  sensing: per-channel current measurement
version: 0.1.0
pcbColor: "#00979d"
# 41 / 25.36 — every Modulino is this board (#722).
aspect: 1.617
dimensions:
  width: 41
  height: 25.36
# The real board's 2 mm corner radius (#739), so the 2-D outline matches the
# generated mesh instead of an eyeballed fraction.
shape:
  kind: rect
  cornerRadiusMm: 2
# Generated by scripts/modulino-mesh.mjs (#722) — regenerate with `npm run
# parts:modulino-meshes`, never hand-edit. The screw terminals aren't modelled:
# the shared flat PCB reads correctly for this one.
mesh: modulino.stl
meshUnits: mm
mass_g: 4.4  # Arduino tech specs
# 0x48. An onboard MCU drives the H-bridge, so this one IS re-addressable —
# note that it shares 0x48 with the common ADS1115/TMP102 breakouts.
i2cAddresses: [72]
mountingHoles:
  - x: 0.10976
    y: 0.18454
    diameter: 3.2
  - x: 0.89024
    y: 0.18454
    diameter: 3.2
  - x: 0.89024
    y: 0.81546
    diameter: 3.2
  - x: 0.10976
    y: 0.81546
    diameter: 3.2
# Motor + supply screw terminals. These are power outputs, not GPIO, so they
# carry no capabilities — they're here so the Board View can wire motors and a
# battery. Their POSITIONS are approximate pending Arduino's mechanical drawing
# (the same provenance caveat as the board outline, #722).
headers:
  - edge: top
    pins:
      - number: 1
        name: VIN
        label: VIN
        type: pwr
        shape: header
        x: 0.2
        y: 0.12
      - number: 2
        name: GND-M
        label: GND
        type: gnd
        shape: header
        x: 0.33
        y: 0.12
      - number: 3
        name: A1
        label: A1
        type: other
        shape: header
        x: 0.62
        y: 0.12
      - number: 4
        name: A2
        label: A2
        type: other
        shape: header
        x: 0.78
        y: 0.12
      - number: 5
        name: B1
        label: B1
        type: other
        shape: header
        x: 0.62
        y: 0.88
      - number: 6
        name: B2
        label: B2
        type: other
        shape: header
        x: 0.78
        y: 0.88
# A QWIIC socket at each end. They are the SAME bus wired in parallel — that is
# what makes Modulinos daisy-chainable — so the two sockets' pins are joined by
# the rails below rather than being four independent nets.
connectors:
  - z: 0
    kind: qwiic
    x: 0.05488
    y: 0.5
    pins:
      - name: GND
        type: gnd
      - name: 3V3
        type: pwr
      - name: SDA
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
  - z: 0
    kind: qwiic
    x: 0.94512
    y: 0.5
    pins:
      - name: GND-B
        type: gnd
      - name: 3V3-B
        type: pwr
      - name: SDA-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
rails:
  # The motor supply's negative shares the logic ground — it is the SEPARATE
  # 5–24 V positive rail that stays isolated from 3V3, not the return path.
  - name: GND
    pins:
      - GND
      - GND-B
      - GND-M
  - name: 3V3
    pins:
      - 3V3
      - 3V3-B
  - name: SDA
    pins:
      - SDA
      - SDA-B
  - name: SCL
    pins:
      - SCL
      - SCL-B
library:
  module: modulino
  docs: https://docs.arduino.cc/hardware/modulino-motors/
# One catalog module covers the WHOLE range (#722), so a board with several
# Modulinos on it is offered a single install, not one per module.
drivers:
  - source: module:modulino
    target: lib/modulino
    label: Arduino Modulino library
help: help.md
