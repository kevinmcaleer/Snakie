id: modulino-buzzer
name: Modulino Buzzer
description: Piezo buzzer driven over I²C — tones by frequency and duration.
manufacturer: Arduino
family: Output
tags:
  - modulino
  - arduino
  - i2c
  - qwiic
  - audio
  - buzzer
  - piezo
  - sound
package: SMD
voltage: 3.3V
partNumber: ABX00108
properties:
  interface: I²C (0x3C, re-addressable — onboard MCU)
  buzzer: Murata PKLCS1212E4001-R1 piezo
  mcu: STM32C011
  outputs: tones by frequency + duration; a NOTES table for melodies
  chain: QWIIC socket at each end, same bus in parallel
version: 0.1.0
pcbColor: "#00979d"
# 41 / 25.36 — every Modulino is this board (#722).
aspect: 1.617
dimensions:
  width: 41
  height: 25.36
# The board's measured 4.6 mm corner radius (#739); the generated mesh uses the
# same number, so the 2-D outline and the 3-D model agree.
shape:
  kind: rect
  cornerRadiusMm: 4.6
# Generated by scripts/modulino-mesh.mjs (#722) — regenerate with `npm run
# parts:modulino-meshes`, never hand-edit.
mesh: modulino.stl
meshUnits: mm
mass_g: 4.2  # Arduino tech specs
# 0x3C, software-configurable via the onboard STM32C011 — so two Buzzers can
# share a chain. Note it collides with the common SSD1306/SH1106 OLED default.
i2cAddresses: [60]
# The piezo can, centred — 12 mm square, the board's one raised part.
shapes:
  - kind: circle
    x: 0.354
    y: 0.264
    w: 0.293
    h: 0.473
    fill: "#1c1f24"
    stroke: "#0d0f12"
    strokeWidth: 1
    label: PIEZO
mountingHoles:
  - x: 0.10976
    y: 0.18454
    diameter: 1.5
  - x: 0.89024
    y: 0.18454
    diameter: 1.5
  - x: 0.89024
    y: 0.81546
    diameter: 1.5
  - x: 0.10976
    y: 0.81546
    diameter: 1.5

connectors:
  - z: 0
    kind: qwiic
    x: 0.05488
    y: 0.5
    pins:
      - name: GND
        type: gnd
      - name: 3V3
        type: pwr
      - name: SDA
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
  - z: 0
    kind: qwiic
    x: 0.94512
    y: 0.5
    pins:
      - name: GND-B
        type: gnd
      - name: 3V3-B
        type: pwr
      - name: SDA-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
rails:
  - name: GND
    pins:
      - GND
      - GND-B
  - name: 3V3
    pins:
      - 3V3
      - 3V3-B
  - name: SDA
    pins:
      - SDA
      - SDA-B
  - name: SCL
    pins:
      - SCL
      - SCL-B
library:
  module: modulino
  docs: https://docs.arduino.cc/hardware/modulino-buttons/
# One catalog module covers the WHOLE range (#722), so a board with several
# Modulinos on it is offered a single install, not one per module.
drivers:
  - source: module:modulino
    target: lib/modulino
    label: Arduino Modulino library
help: help.md
