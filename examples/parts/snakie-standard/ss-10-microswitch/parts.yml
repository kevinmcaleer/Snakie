# Open Duck Mini v2 part, built with the build-part-from-image skill.
id: ss-10-microswitch
name: SS-10 Micro Switch
description: Subminiature snap-action micro switch with a pin plunger. The Open Duck Mini puts one in
  each foot (4 total) to sense ground contact. COM connects to NC at rest and to NO when pressed. Lugs left to right, plunger end first, are C (COM), NO and NC, as moulded on the body.
