# (packages/layers/src/scene/connectors.ts, written by scripts/connector-stls.ts),
# so the id matches the plug's connector id there.
id: jst-ph-2
name: "JST PH 2-way plug"
description: "Crimp housing (PHR) on the end of a lead, 2 mm pitch: small LiPo cells and sensors."
manufacturer: JST
family: Connector
tags:
  - connector
  - plug
  - jst-ph
package: Crimp housing
pinSpacing: 2.0
partNumber: "PHR-2"
properties:
  pitch: "2.0 mm"
  ways: 2
