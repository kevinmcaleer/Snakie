id: 9v-battery
name: 9V Battery
description: A 9 V PP3 block, photographed and modelled in 3-D — high internal resistance, so regulator supplies only, never motors.
manufacturer: Duracell
family: Power
help: help.md
tags:
  - battery
  - pp3
  - power
package: THT
pinSpacing: 2.54
voltage: 9V
mass_g: 45
version: 0.1.2
electrical:
  model: source
  supplyV: 9
  # A PP3 is six tiny cells in series, so it sags hard under load. Modelling the
  # internal resistance is the point — it is what makes the Electronics workspace
  # show the brown-out instead of pretending 9 V arrives intact.
  resistanceOhms: 1.7
  maxCurrentA: 0.5
  capacityMah: 550
  terminals:
    positive: VCC
    negative: GND
