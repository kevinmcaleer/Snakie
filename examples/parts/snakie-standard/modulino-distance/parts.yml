id: modulino-distance
name: Modulino Distance
description: VL53L4CD time-of-flight distance sensor on an I²C Modulino, daisy-chainable over QWIIC.
manufacturer: Arduino
family: Sensor
tags:
  - modulino
  - arduino
  - i2c
  - qwiic
  - distance
  - tof
  - vl53l4cd
  - sensor
package: SMD
voltage: 3.3V
partNumber: ABX00102
properties:
  interface: I²C (0x29, FIXED — no onboard MCU)
  sensor: VL53L4CDV0DH/1 time-of-flight
  measures: distance to the nearest obstacle, in millimetres
  chain: QWIIC socket at each end, same bus in parallel
version: 0.1.0
pcbColor: "#00979d"
# 41 / 25.36 — every Modulino is this board (#722).
aspect: 1.617
dimensions:
  width: 41
  height: 25.36
# The board's measured 4.6 mm corner radius (#739); the generated mesh uses the
# same number, so the 2-D outline and the 3-D model agree.
shape:
  kind: rect
  cornerRadiusMm: 4.6
# Generated by scripts/modulino-mesh.mjs (#722) — regenerate with `npm run
# parts:modulino-meshes`, never hand-edit.
mesh: modulino.stl
meshUnits: mm
mass_g: 4.1  # Arduino tech specs
# 0x29 — the VL53L4CD's OWN address. There is no onboard MCU to re-map it,
# so two Distance modules cannot share one chain.
i2cAddresses: [41]
# The ToF sensor package, centred — the one piece of top-side hardware.
shapes:
  - kind: rect
    x: 0.435
    y: 0.4
    w: 0.13
    h: 0.2
    fill: "#2b2f36"
    stroke: "#14171b"
    strokeWidth: 1
    cornerRadius: 2
    label: VL53L4CD
mountingHoles:
  - x: 0.10976
    y: 0.18454
    diameter: 1.5
  - x: 0.89024
    y: 0.18454
    diameter: 1.5
  - x: 0.89024
    y: 0.81546
    diameter: 1.5
  - x: 0.10976
    y: 0.81546
    diameter: 1.5

connectors:
  - z: 0
    kind: qwiic
    x: 0.05488
    y: 0.5
    pins:
      - name: GND
        type: gnd
      - name: 3V3
        type: pwr
      - name: SDA
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
  - z: 0
    kind: qwiic
    x: 0.94512
    y: 0.5
    pins:
      - name: GND-B
        type: gnd
      - name: 3V3-B
        type: pwr
      - name: SDA-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
rails:
  - name: GND
    pins:
      - GND
      - GND-B
  - name: 3V3
    pins:
      - 3V3
      - 3V3-B
  - name: SDA
    pins:
      - SDA
      - SDA-B
  - name: SCL
    pins:
      - SCL
      - SCL-B
library:
  module: modulino
  docs: https://docs.arduino.cc/hardware/modulino-buttons/
# One catalog module covers the WHOLE range (#722), so a board with several
# Modulinos on it is offered a single install, not one per module.
drivers:
  - source: module:modulino
    target: lib/modulino
    label: Arduino Modulino library
help: help.md
