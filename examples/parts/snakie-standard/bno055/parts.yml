# Open Duck Mini v2 part, built with the build-part-from-image skill.
id: bno055
name: BNO055 9-DOF Absolute Orientation
description: 'Bosch BNO055 IMU breakout: accelerometer, gyro and magnetometer with on-chip sensor fusion,
  so it reports orientation (Euler angles / quaternions) directly. I²C. The Open Duck Mini''s balance
  sensor.'
manufacturer: Adafruit
family: Sensor
tags:
- sensor
- imu
- i2c
- orientation
- accelerometer
- gyroscope
- magnetometer
package: THT
pinSpacing: 2.54
voltage: 3.3-5V
partNumber: '2472'
properties:
  chip: Bosch BNO055
  interface: 'I²C 0x28 (ADR high: 0x29)'
  output: Euler, quaternion, linear accel, gravity
  note: Uses I²C clock stretching
version: 0.1.0
pcbColor: '#1a5fb4'
aspect: 0.76
dimensions:
  width: 20.3
  height: 26.7
shape:
  kind: rect
  cornerRadiusMm: 2
headers:
- edge: left
  pins:
