    type: pwr
    number: 1
    shape: header
    rotation: 180
    x: 0.073
    y: 0.264
  - name: 3vo
    type: pwr
    number: 2
    shape: header
    rotation: 180
    x: 0.073
    y: 0.357
  - name: GND
    type: gnd
    number: 3
    shape: header
    rotation: 180
    x: 0.073
    y: 0.449
  - name: SDA
