    number: 5
    capabilities:
    - i2c
    signals:
      i2c: SCL
    shape: header
    rotation: 180
    x: 0.073
    y: 0.637
  - name: RST
    type: io
    number: 6
    capabilities:
    - digital
    shape: header
    rotation: 180
    x: 0.073
    y: 0.725
- edge: right
  pins:
  - name: PS0
    type: other
    number: 7
    shape: header
    rotation: 0
    x: 0.924
    y: 0.363
  - name: PS1
    type: other
    number: 8
    shape: header
    rotation: 0
