# Open Duck Mini v2 part, built with the build-part-from-image skill.
id: sts3215-bus-servo
name: Feetech STS3215 Bus Servo
description: Serial bus servo with a 360° magnetic encoder, position/speed/load feedback and ID-addressed
  half-duplex TTL control. Two daisy-chain ports. The Open Duck Mini uses 14 of the 7.4 V version.
manufacturer: Feetech
family: Motor
tags:
- servo
- bus
- sts3215
- motor
- serial
package: THT
voltage: 6-8.4V (7.4V version)
partNumber: STS3215
properties:
  torque: 19.5 kg·cm @ 7.4 V
  speed: 0.222 s/60° @ 7.4 V
  encoder: 12-bit magnetic, 360°
  interface: half-duplex TTL serial bus, 1 Mbps default
  connector: 2× 5264-3P (daisy chain)
  pinout: 'D V G, left to right with the horn up: data, VCC (middle), GND'
version: 0.1.0
