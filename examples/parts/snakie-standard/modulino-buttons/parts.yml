id: modulino-buttons
name: Modulino Buttons
description: Three buttons and three LEDs on an I²C Modulino, daisy-chainable over QWIIC.
manufacturer: Arduino
family: Input
tags:
  - modulino
  - arduino
  - i2c
  - qwiic
  - button
  - led
package: SMD
voltage: 3.3V
partNumber: ABX00110
properties:
  interface: I²C (0x7C, re-addressable — onboard MCU)
  inputs: 3 momentary buttons (A, B, C)
  outputs: 3 LEDs, one above each button
  chain: QWIIC socket at each end, same bus in parallel
version: 0.1.0
pcbColor: "#00979d"
# 41 / 25.36 — every Modulino is this board (#722).
aspect: 1.617
dimensions:
  width: 41
  height: 25.36
# Generated by scripts/modulino-mesh.mjs (#722) — regenerate with `npm run
# parts:modulino-meshes`, never hand-edit.
mesh: modulino.stl
meshUnits: mm
mass_g: 4.4  # Arduino tech specs
# 0x7C. The onboard MCU means this one CAN be re-addressed, so two Buttons
# modules can share a chain.
i2cAddresses: [124]
mountingHoles:
  - x: 0.10976
    y: 0.18454
    diameter: 3.2
  - x: 0.89024
    y: 0.18454
    diameter: 3.2
  - x: 0.89024
    y: 0.81546
    diameter: 3.2
  - x: 0.10976
    y: 0.81546
    diameter: 3.2
buttons:
  - x: 0.3
    y: 0.62
    label: A
  - x: 0.5
    y: 0.62
    label: B
  - x: 0.7
    y: 0.62
    label: C
leds:
  - x: 0.3
    y: 0.34
    kind: single
    label: A
  - x: 0.5
    y: 0.34
    kind: single
    label: B
  - x: 0.7
    y: 0.34
    kind: single
    label: C
# A QWIIC socket at each end. They are the SAME bus wired in parallel — that is
# what makes Modulinos daisy-chainable — so the two sockets' pins are joined by
# the rails below rather than being four independent nets.
connectors:
  - z: 0
    kind: qwiic
    x: 0.05488
    y: 0.5
    pins:
      - name: GND
        type: gnd
      - name: 3V3
        type: pwr
      - name: SDA
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
  - z: 0
    kind: qwiic
    x: 0.94512
    y: 0.5
    pins:
      - name: GND-B
        type: gnd
      - name: 3V3-B
        type: pwr
      - name: SDA-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SDA
      - name: SCL-B
        type: io
        capabilities:
          - i2c
        signals:
          i2c: SCL
rails:
  - name: GND
    pins:
      - GND
      - GND-B
  - name: 3V3
    pins:
      - 3V3
      - 3V3-B
  - name: SDA
    pins:
      - SDA
      - SDA-B
  - name: SCL
    pins:
      - SCL
      - SCL-B
library:
  module: modulino
  docs: https://docs.arduino.cc/hardware/modulino-buttons/
# One catalog module covers the WHOLE range (#722), so a board with several
# Modulinos on it is offered a single install, not one per module.
drivers:
  - source: module:modulino
    target: lib/modulino
    label: Arduino Modulino library
help: help.md
