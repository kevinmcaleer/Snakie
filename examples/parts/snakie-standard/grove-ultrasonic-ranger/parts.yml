id: grove-ultrasonic-ranger
name: Grove Ultrasonic Ranger
description: Ultrasonic distance sensor on a Grove digital module — trigger and echo share ONE pin.
manufacturer: Seeed Studio
family: Sensor
tags:
  - grove
  - seeed
  - ultrasonic
  - distance
  - range
  - digital
package: THT
pinSpacing: 2.0
voltage: 3.2-5.2V
partNumber: "101020010"
properties:
  interface: single-wire digital (trigger and echo on the same pin)
  range: 2 cm – 350 cm
  angle: 15°
version: 0.1.1
pcbColor: "#1b4d3e"
aspect: 2.15
dimensions:
  width: 43
  height: 20
shape:
  kind: rect
  cornerRadius: 2
headers: []
# One SIG line does both trigger and echo — this is NOT an HC-SR04 (which has
# separate TRIG/ECHO pins) and the two are not interchangeable in code.
connectors:
  - kind: grove
    variant: digital
    label: SIG
    x: 0.15
    y: 0.5
    rotation: 90
    pins:
      - name: SIG
        type: io
        capabilities: [digital]
      - name: NC
        type: other
      - name: VCC
        type: pwr
      - name: GND
        type: gnd
shapes:
  - kind: rect
    x: 0.02
    y: 0.04
    w: 0.96
    h: 0.92
    fill: "#1b4d3e"
    stroke: "#0f3227"
    strokeWidth: 1
    cornerRadius: 3
    z: 0
  # The two ultrasonic transducer cans.
  - kind: circle
    x: 0.36
    y: 0.13
    w: 0.26
    h: 0.74
    fill: "#8f9399"
    stroke: "#5c6066"
    strokeWidth: 1
    z: 1
  - kind: circle
    x: 0.68
    y: 0.13
    w: 0.26
    h: 0.74
    fill: "#8f9399"
    stroke: "#5c6066"
    strokeWidth: 1
    z: 1
labels:
  - text: ULTRASONIC
    x: 0.30
    y: 0.88
    fontSize: 5
    color: "#cfe8dc"
    z: 2
suggests:
  - module: grove-ultrasonic
    unlocks: distance readings from the one-wire ranger
help: help.md
layerVisibility:
  pcb: false
  image: false
  holes: true
  pins: true
  components: true
