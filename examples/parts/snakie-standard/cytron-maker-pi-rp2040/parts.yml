id: cytron-maker-pi-rp2040
name: Cytron Maker Pi RP2040
description: "RP2040 robot controller: 2 DC motor channels, 4 servo ports, 7 Grove ports, 2 NeoPixels, a piezo buzzer and two programmable buttons. Runs from USB, a single-cell LiPo, or 3.6-6 V on VIN."
manufacturer: Cytron Technologies
family: Microcontroller
tags:
  - rp2040
  - robotics
  - grove
  - motor-driver
package: SMD
pinSpacing: 2
voltage: 3.6-6V
partNumber: MAKER-PI-RP2040
properties:
  Motor channels: 2 (DRV8833, 1 A continuous / 1.5 A peak each)
  Motor pins: M1A=GP8, M1B=GP9, M2A=GP10, M2B=GP11
  Servo pins: GP12, GP13, GP14, GP15
  NeoPixel: 2 x WS2812B on GP18
  Buttons: GP20, GP21
  Buzzer: piezo on GP22 (mute switch on board)
  Battery monitor: GP29 (ADC3, 1:2 divider)
  USB: micro-B
version: 0.1.2
