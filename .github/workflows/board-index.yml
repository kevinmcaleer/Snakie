name: Board index

# Refresh the board index from MicroPython (#893).
#
# The index is DETACHED from the app: a board added upstream should reach the
# picker without waiting for a Snakie release. This is what keeps it current.
#
# Two cadences, because the two things move at different speeds:
#
#   - DAILY, it checks whether MicroPython's newest release tag has changed.
#     That is one API call. If it has not, the run stops — there is nothing new
#     to find, and asking micropython.org for 225 download pages to be told so
#     would be rude.
#   - WEEKLY, it rebuilds regardless, so a board added to an existing release,
#     a re-published binary or a new photo is picked up even without a tag.
#
# It commits only when the content actually changed, so the document's date only
# moves when something did and clients are not re-fetching an identical file.
on:
  schedule:
    # 04:17 UTC — off the hour, so it is not competing with everyone else's cron.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the release tag has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: board-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ImageMagick is what the generator reaches for first; the runner has it,
      # so thumbnails are produced identically to a local run.
      - name: Check the tooling the generator needs
        run: |
          command -v magick || command -v convert || {
            echo "no ImageMagick on the runner — thumbnails would be skipped"; exit 1;
          }

      - name: Has MicroPython released anything new?
        id: check
        run: |
          set -euo pipefail
          latest=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/micropython/micropython/tags?per_page=100" \
            | python3 -c "
          import sys, json, re
          tags=[t['name'] for t in json.load(sys.stdin)]
          stable=[t for t in tags if re.fullmatch(r'v\d+\.\d+(\.\d+)?', t)]
          key=lambda v: tuple(int(x) for x in (v[1:].split('.')+['0'])[:3])
          print(sorted(stable, key=key)[-1] if stable else '')
          ")
          have=$(python3 -c "
          import json
          try: print(json.load(open('src/renderer/public/boards/boards.json'))['micropython'])
          except Exception: print('')
          ")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          # Sunday, a manual force, or a genuinely new tag.
          if [ "$latest" != "$have" ] || [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "rebuild=yes" >> "$GITHUB_OUTPUT"
            echo "Rebuilding — upstream is $latest, index has ${have:-nothing}"
          else
            echo "rebuild=no" >> "$GITHUB_OUTPUT"
            echo "Up to date at $have; nothing to do"
          fi

      - name: Rebuild the index
        if: steps.check.outputs.rebuild == 'yes'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-board-index.mjs --tag "${{ steps.check.outputs.latest }}"

      # A generator that silently emitted nothing would otherwise be committed
      # and shipped. The suite asserts the seed parses, is not empty, and still
      # carries the variants — so run it before anything is written back.
      - name: Prove the new index is sound
        if: steps.check.outputs.rebuild == 'yes'
        run: |
          npm ci
          npx vitest run test/boardIndex.test.ts

      - name: Commit, only if something actually changed
        if: steps.check.outputs.rebuild == 'yes'
        run: |
          set -euo pipefail
          if git diff --quiet -- src/renderer/public/boards; then
            echo "Index is byte-identical; nothing to commit"
            exit 0
          fi
          boards=$(python3 -c "
          import json; print(len(json.load(open('src/renderer/public/boards/boards.json'))['boards']))
          ")
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/renderer/public/boards
          git commit -m "chore(boards): refresh the board index from MicroPython ${{ steps.check.outputs.latest }}

          $boards boards. Generated by .github/workflows/board-index.yml (#893)."
          git push
